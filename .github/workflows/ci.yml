name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go build, vet, test (incl. in-process e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build plugin binary
        run: go build ./...

  ui:
    name: UI remote test + remoteEntry build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # npm ci runs the postinstall hook (scripts/build-sdk.mjs) which clones
      # and builds @inari/ui-plugin-sdk until it is published to npm.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: remoteEntry.js emitted
        run: test -f dist/remoteEntry.js

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
