name: release

# Detects a merged Release PR (release-please action self-detection — robust
# under merge-commit and squash alike) and creates the per-component tags +
# GitHub Releases itself (backend vX.Y.Z, UI remote ui-vX.Y.Z). Publish jobs
# gate on its outputs. No tag-push triggers, no manual releases.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Detect release + tag via release-please
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.releases_created }}
      backend_version: ${{ steps.map.outputs.backend_version }}
      backend_released: ${{ steps.map.outputs.backend_released }}
      ui_version: ${{ steps.map.outputs.ui_version }}
      ui_released: ${{ steps.map.outputs.ui_released }}
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Map released components
        id: map
        if: steps.rp.outputs.releases_created == 'true'
        run: |
          set -euo pipefail
          OUTS='${{ toJson(steps.rp.outputs) }}'
          PATHS='${{ steps.rp.outputs.paths_released }}'
          echo "released paths: $PATHS"
          for p in $(jq -r '.[]' <<< "$PATHS"); do
            tag="$(jq -r --arg p "$p" '.[$p + "--tag_name"] // empty' <<< "$OUTS")"
            echo "$p -> $tag"
            case "$p" in
              ".")  echo "backend_released=true" >> "$GITHUB_OUTPUT"; echo "backend_version=${tag#v}" >> "$GITHUB_OUTPUT";;
              "ui") echo "ui_released=true" >> "$GITHUB_OUTPUT"; echo "ui_version=${tag#ui-v}" >> "$GITHUB_OUTPUT";;
            esac
          done
          grep -q backend_released "$GITHUB_OUTPUT" || echo "backend_released=false" >> "$GITHUB_OUTPUT"
          grep -q ui_released "$GITHUB_OUTPUT" || echo "ui_released=false" >> "$GITHUB_OUTPUT"

  publish-backend:
    name: Build, push and cosign-sign backend image
    needs: release
    if: needs.release.outputs.backend_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Dockerfile (scaffold lands in M4-W3)
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then echo "path=Dockerfile" >> "$GITHUB_OUTPUT";
          elif [ -f backend/Dockerfile ]; then echo "path=backend/Dockerfile" >> "$GITHUB_OUTPUT";
          else echo "path=" >> "$GITHUB_OUTPUT"; fi
      - uses: sigstore/cosign-installer@v3
        if: steps.dockerfile.outputs.path != ''
      - uses: docker/setup-buildx-action@v3
        if: steps.dockerfile.outputs.path != ''
      - uses: docker/login-action@v3
        if: steps.dockerfile.outputs.path != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.dockerfile.outputs.path != ''
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: |
            ${{ env.IMAGE }}:v${{ needs.release.outputs.backend_version }}
            ${{ env.IMAGE }}:latest
      - name: Cosign sign (keyless)
        if: steps.dockerfile.outputs.path != ''
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:v${{ needs.release.outputs.backend_version }}" --format '{{.Manifest.Digest}}')"
          cosign sign --yes "${IMAGE}@${digest}"

  publish-ui:
    name: Build and publish UI remoteEntry.js
    needs: release
    if: needs.release.outputs.ui_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for UI scaffold (lands in M4-W3)
        id: ui
        run: |
          if [ -f ui/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.ui.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI remote
        if: steps.ui.outputs.present == 'true'
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Upload remoteEntry.js to GitHub Release
        if: steps.ui.outputs.present == 'true'
        run: |
          tag="ui-v${{ needs.release.outputs.ui_version }}"
          find ui/dist -name 'remoteEntry.js' -exec gh release upload "$tag" {} --clobber \;
