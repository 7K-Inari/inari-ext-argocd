name: release

# Detects a merged Release PR (release-please action self-detection — robust
# under merge-commit and squash alike) and creates the per-component tags +
# GitHub Releases itself (backend vX.Y.Z, UI remote ui-vX.Y.Z). Publish jobs
# gate on its outputs. No tag-push triggers, no manual releases.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Detect release + tag via release-please
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.releases_created }}
      backend_version: ${{ steps.map.outputs.backend_version }}
      backend_released: ${{ steps.map.outputs.backend_released }}
      ui_version: ${{ steps.map.outputs.ui_version }}
      ui_released: ${{ steps.map.outputs.ui_released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Map released components
        id: map
        if: steps.rp.outputs.releases_created == 'true'
        run: |
          set -euo pipefail
          OUTS='${{ toJson(steps.rp.outputs) }}'
          PATHS='${{ steps.rp.outputs.paths_released }}'
          echo "released paths: $PATHS"
          for p in $(jq -r '.[]' <<< "$PATHS"); do
            # release-please emits the root path "." under the unprefixed
            # key "tag_name" (not ".--tag_name"); other paths use "<path>--tag_name".
            tag="$(jq -r --arg p "$p" 'if $p == "." then .tag_name // empty else .[$p + "--tag_name"] // empty end' <<< "$OUTS")"
            echo "$p -> $tag"
            case "$p" in
              ".")  echo "backend_released=true" >> "$GITHUB_OUTPUT"; echo "backend_version=${tag#v}" >> "$GITHUB_OUTPUT";;
              "ui") echo "ui_released=true" >> "$GITHUB_OUTPUT"; echo "ui_version=${tag#ui-v}" >> "$GITHUB_OUTPUT";;
            esac
          done
          grep -q backend_released "$GITHUB_OUTPUT" || echo "backend_released=false" >> "$GITHUB_OUTPUT"
          grep -q ui_released "$GITHUB_OUTPUT" || echo "ui_released=false" >> "$GITHUB_OUTPUT"

  publish-backend:
    name: Build, push and cosign-sign backend image
    needs: release
    if: needs.release.outputs.backend_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compute lowercase image name
        # github.repository preserves the org's casing ("7K-Inari"), but
        # docker tags must be lowercase.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Check for Dockerfile (scaffold lands in M4-W3)
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then echo "path=Dockerfile" >> "$GITHUB_OUTPUT";
          elif [ -f backend/Dockerfile ]; then echo "path=backend/Dockerfile" >> "$GITHUB_OUTPUT";
          else echo "path=" >> "$GITHUB_OUTPUT"; fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.dockerfile.outputs.path != ''
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.dockerfile.outputs.path != ''
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.dockerfile.outputs.path != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: steps.dockerfile.outputs.path != ''
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: |
            ${{ env.IMAGE }}:v${{ needs.release.outputs.backend_version }}
            ${{ env.IMAGE }}:latest
      - name: Cosign sign (keyless)
        if: steps.dockerfile.outputs.path != ''
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:v${{ needs.release.outputs.backend_version }}" --format '{{.Manifest.Digest}}')"
          cosign sign --yes "${IMAGE}@${digest}"

  publish-ui:
    name: Build and publish UI remoteEntry.js
    needs: release
    if: needs.release.outputs.ui_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for UI scaffold (lands in M4-W3)
        id: ui
        run: |
          if [ -f ui/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.ui.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI remote
        if: steps.ui.outputs.present == 'true'
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Upload remoteEntry.js + chunks to GitHub Release
        if: steps.ui.outputs.present == 'true'
        run: |
          tag="ui-v${{ needs.release.outputs.ui_version }}"
          # Webpack MF remotes lazy-load async chunks next to remoteEntry.js —
          # upload the whole dist so hubs can serve them (RUNTIME/chunk errors
          # otherwise).
          find ui/dist \( -name '*.js' -o -name '*.js.LICENSE.txt' \) -exec gh release upload "$tag" {} --clobber \;
      - name: Verify release asset completeness
        if: steps.ui.outputs.present == 'true'
        working-directory: ui
        # Guard for the "Loading chunk 616 failed" regression (issue #10):
        # fail the release if any dist js/chunk is missing from the release.
        run: node scripts/check-release-assets.mjs "ui-v${{ needs.release.outputs.ui_version }}"
