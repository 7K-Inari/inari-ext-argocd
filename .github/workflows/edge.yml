name: edge

# Per-merge edge releases: every push to main tags the backend image
# <pending>-<shortsha> (plus :edge) and cuts per-component GitHub
# prereleases (vX.Y.Z-<sha> for the backend, ui-vX.Y.Z-<sha> for
# the UI remote, with its dist assets attached). Skipped on release merges —
# release.yml covers that commit.
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: edge-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Skip on release merges
        id: gate
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          parent2=""
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            parent2="$(git log -1 --pretty=%s HEAD^2)"
          fi
          if echo "$msg" | grep -qiE '^chore(\(.*\))?: release' \
             || echo "$parent2" | grep -qiE '^chore(\(.*\))?: release'; then
            echo "release merge detected ($msg) — skipping edge"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      edge_backend: ${{ steps.b.outputs.edge }}
      edge_ui: ${{ steps.u.outputs.edge }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve backend edge version
        id: b
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "edge=$(scripts/resolve-edge-version.sh .)" >> "$GITHUB_OUTPUT"
      - name: Resolve UI edge version
        id: u
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "edge=$(scripts/resolve-edge-version.sh ui)" >> "$GITHUB_OUTPUT"

  edge-image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        # github.repository preserves the org's casing ("7K-Inari"), but
        # docker tags must be lowercase.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Check for Dockerfile (scaffold lands in M4-W3)
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then echo "path=Dockerfile" >> "$GITHUB_OUTPUT";
          elif [ -f backend/Dockerfile ]; then echo "path=backend/Dockerfile" >> "$GITHUB_OUTPUT";
          else echo "path=" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.dockerfile.outputs.path != ''
      - uses: docker/login-action@v3
        if: steps.dockerfile.outputs.path != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push edge image
        if: steps.dockerfile.outputs.path != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:${{ needs.version.outputs.edge_backend }}

  edge-ui:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for UI scaffold
        id: ui
        run: |
          if [ -f ui/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.ui.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI remote
        if: steps.ui.outputs.present == 'true'
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Create UI edge prerelease with remote assets
        if: steps.ui.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDGE: ${{ needs.version.outputs.edge_ui }}
        run: |
          tag="ui-v${EDGE}"
          gh release create "$tag" \
            --prerelease \
            --title "ui edge ${EDGE}" \
            --notes "Edge build of the UI remote from ${GITHUB_SHA}. Superseded by the next stable ui-vX.Y.Z release."
          find ui/dist \( -name '*.js' -o -name '*.js.LICENSE.txt' \) -exec gh release upload "$tag" {} --clobber \;

  prerelease:
    needs: [version, edge-image, edge-ui]
    if: always() && needs.edge-image.result != 'failure' && needs.edge-ui.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create backend edge prerelease + move the edge channel tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDGE: ${{ needs.version.outputs.edge_backend }}
        run: |
          set -euo pipefail
          gh release create "v${EDGE}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "edge ${EDGE}" \
            --notes "Edge build from ${GITHUB_SHA}. Image tagged \`:edge\` and \`:${EDGE}\` (when a Dockerfile exists). Superseded by the next stable vX.Y.Z release."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
          if gh release view edge > /dev/null 2>&1; then
            gh release edit edge --prerelease --title "edge (v${EDGE})" \
              --notes "Latest edge build: \`v${EDGE}\` (${GITHUB_SHA})."
          else
            gh release create edge --prerelease --target "$GITHUB_SHA" \
              --title "edge (v${EDGE})" \
              --notes "Latest edge build: \`v${EDGE}\` (${GITHUB_SHA})."
          fi
